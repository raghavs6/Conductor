[project]
name = "mm-ai-agent"
version = "0.1.0"
description = "FastAPI skeleton with health and chat endpoints"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.26",
]

[tool.pytest.ini_options]
addopts = "-q"
